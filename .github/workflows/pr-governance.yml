# Thin caller for the shared HorneroOS PR-governance engine.
#
# The engine lives in HorneroOS/.github (`governance/danger`) and is
# versioned by `governance-*` tags: callers pin a full commit SHA with a
# version comment (currently governance-v1.6).
#
# Fork-safe: triggers on `pull_request` (never `pull_request_target`
# combined with checkout + execution of PR code). Least privilege below.

name: PR governance

"on":
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

jobs:
  governance:
    uses: HorneroOS/.github/.github/workflows/pr-governance.yml@906d6dad0638773413442ffafa03a5da4da160b1 # governance-v1.6
    with:
      engine-ref: 906d6dad0638773413442ffafa03a5da4da160b1 # governance-v1.6
    permissions:
      contents: read
      pull-requests: write
